name: Zokeibi CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.5 Zokeibi Quality Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: dom, json, mbstring, openssl, sodium, zlib
          ini-values: session.upload_progress.enabled=Off, zend.exception_ignore_args=On, expose_php=Off
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Manifest & Supply-Chain Audit
        run: |
          composer validate --no-check-publish --strict
          composer audit --locked --abandoned=report

      - name: Run PHPStan L9, PHPUnit 13 & Playground Audit
        run: composer quality
